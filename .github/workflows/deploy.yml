name: 🚀 Deploy HappyBook Client

on:
  push:
    branches:
      - master

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: 🐛 Debug Information
        run: |
          echo "🔀 Branch: ${{ github.ref_name }}"
          echo "📝 Commit: ${{ github.sha }}"
          echo "👤 Actor: ${{ github.actor }}"
          echo "📦 Repository: ${{ github.repository }}"
          echo "🏷️ Event: ${{ github.event_name }}"
          echo "🕐 Timestamp: $(date +'%Y-%m-%d %H:%M:%S %Z')"
          echo "🌍 Environment: Production"
          echo "🖥️ VPS Host: ${{ vars.VPS_HOST }}"
          echo "👤 VPS User: ${{ vars.VPS_USERNAME }}"
          echo "🔌 VPS Port: ${{ vars.VPS_PORT }}"

      - name: 🔐 Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ vars.VPS_PORT }}
          script: |
            cd /var/www/bed_happybook_client

            # Force sync code từ GitHub — CHỈ ghi đè file tracked
            # KHÔNG dùng git clean → bảo toàn .env và mọi file hệ thống
            git fetch origin master
            git reset --hard origin/master

            # Cài đặt dependencies và build
            yarn install
            yarn build

            # Restart PM2
            pm2 restart happybook
