name: 🚀 Deploy HappyBook Client

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    name: Build & Deploy to VPS
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Hoặc phiên bản Node trên VPS của bạn
          cache: 'yarn'

      - name: 📦 Install Dependencies
        run: yarn install --frozen-lockfile

      - name: 🔑 Fetch .env from VPS
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          scp -o StrictHostKeyChecking=no -P ${{ vars.VPS_PORT }} -i ~/.ssh/id_rsa ${{ vars.VPS_USERNAME }}@${{ vars.VPS_HOST }}:/var/www/bed_happybook_client/.env .env || echo "⚠️ Warning: No .env file found on VPS. Falling back to default env variables."
          if [ -f .env ]; then
            echo "✅ Loaded environment variables keys from VPS:"
            cut -d'=' -f1 .env
          fi

      - name: 🔨 Build Next.js Application
        # Nếu build Next.js cần biến môi trường tĩnh, bạn khai báo ở đây:
        env:
          NEXT_PUBLIC_API_ENDPOINT: https://api.happybooktravel.com/api/v1
        run: yarn build

      - name: 🗜️ Compress Build Files
        # Nén các thư mục cần thiết để chạy Next.js: .next, public, package.json, yarn.lock, config
        run: |
          tar -czf deploy.tar.gz .next public package.json yarn.lock next.config.mjs

      - name: 📤 Upload Build Archive to VPS
        # Sử dụng SCP để đẩy file nén lên thư mục tạm trên VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ vars.VPS_PORT }}
          source: "deploy.tar.gz"
          target: "/var/www/bed_happybook_client"

      - name: 🔐 Extract and Restart PM2 via SSH
        # SSH vào giải nén và restart PM2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ vars.VPS_PORT }}
          script: |
            cd /var/www/bed_happybook_client
            
            # Giải nén đè lên thư mục hiện tại
            tar -xzf deploy.tar.gz -C .
            rm deploy.tar.gz

            # Cài đặt lại các package phục vụ production (nhanh và nhẹ hơn)
            yarn install --production --prefer-offline

            # Reload PM2 (Zero-downtime reload) with fallback
            pm2 reload happybook || pm2 restart happybook
